<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Automation Detection Lab</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main class="shell">
    <section class="topbar">
      <div>
        <p class="eyebrow">Browser Automation Detection Lab</p>
        <h1>自动化操作检测页</h1>
        <p class="intro">采集浏览器环境、自动化痕迹、运行时一致性、图形指纹和交互行为，生成一个可解释风险分。</p>
      </div>
      <div class="score-card" aria-live="polite">
        <span class="score-label">Risk Score</span>
        <strong id="riskScore">--</strong>
        <span id="classification" class="classification">running</span>
      </div>
    </section>

    <section class="actions" aria-label="检测操作">
      <button id="runBtn" type="button">重新检测</button>
      <button id="exportBtn" type="button" class="secondary">导出 JSON</button>
      <button id="resetBehaviorBtn" type="button" class="secondary">重置行为采样</button>
      <span id="statusText" class="status">正在初始化检测...</span>
    </section>

    <section class="behavior-pad" aria-label="行为采样区">
      <div>
        <h2>行为采样区</h2>
        <p>在这里移动鼠标、点击、滚动或输入文字。页面会实时观察交互节奏，但不会上传任何数据。</p>
        <div class="probe-targets" aria-label="点击采样靶场">
          <button type="button" class="probe-btn" data-probe-target="alpha">目标 A</button>
          <button type="button" class="probe-btn" data-probe-target="beta">目标 B</button>
          <button type="button" class="probe-btn" data-probe-target="gamma">目标 C</button>
        </div>
      </div>
      <label>
        <span>输入测试</span>
        <textarea id="typingProbe" rows="4" placeholder="可以随便输入几句话，用于观察输入间隔、修正和粘贴行为。"></textarea>
      </label>
    </section>

    <section class="summary-grid" id="summaryGrid" aria-label="检测摘要"></section>

    <section class="report">
      <div class="report-head">
        <h2>检测详情</h2>
        <p>强信号会显著提高风险分，弱信号只作为组合判断。单项命中不等同于最终结论。</p>
      </div>
      <div id="findings" class="findings"></div>
    </section>

    <section class="raw">
      <div class="report-head">
        <h2>原始报告</h2>
        <p>可用于接入自动化回归、基线对比或服务端评分。</p>
      </div>
      <pre id="rawReport">{}</pre>
    </section>
  </main>

  <script src="./detector.js"></script>
</body>
</html>
